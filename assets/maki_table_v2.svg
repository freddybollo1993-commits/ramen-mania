<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">
  <defs>
    <linearGradient id="tableWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6835"/>
      <stop offset="1" stop-color="#744720"/>
    </linearGradient>
    <linearGradient id="boardWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8bf80"/>
      <stop offset="1" stop-color="#d2a05f"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-12%" width="112%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Mesa de madera (vista frontal, plana) -->
  <rect x="2" y="2" width="596" height="136" rx="16" fill="url(#tableWood)" stroke="#4a2b11" stroke-width="3"/>
  <g stroke="#5b3817" stroke-width="1.6" opacity="0.5">
    <line x1="6" y1="36" x2="594" y2="36"/>
    <line x1="6" y1="70" x2="594" y2="70"/>
    <line x1="6" y1="104" x2="594" y2="104"/>
  </g>
  <g fill="none" stroke="#5b3817" stroke-width="1" opacity="0.28">
    <path d="M12,20 C120,14 250,26 390,18 S560,22 590,16"/>
    <path d="M10,54 C140,60 260,48 400,56 S560,50 592,58"/>
    <path d="M14,88 C110,82 260,94 380,86 S540,92 590,84"/>
    <path d="M12,122 C150,128 270,116 380,124 S560,118 590,126"/>
  </g>

  <!-- Tabla de cortar (vacía): la esterilla se coloca encima -->
  <g filter="url(#shadow)">
    <rect x="140" y="12" width="320" height="116" rx="14" fill="url(#boardWood)" stroke="#9a6a35" stroke-width="2.6"/>
    <rect x="147" y="19" width="306" height="102" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.6"/>
    <g fill="none" stroke="#b98446" stroke-width="1.2" opacity="0.5">
      <path d="M152,36 C230,30 330,42 448,34"/>
      <path d="M152,66 C240,72 340,60 448,68"/>
      <path d="M152,96 C232,90 336,102 448,94"/>
      <path d="M152,114 C240,118 340,110 448,116"/>
    </g>
  </g>
</svg>
