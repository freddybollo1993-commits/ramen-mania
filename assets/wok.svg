<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 186" width="300" height="186">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#525861"/>
      <stop offset="0.45" stop-color="#25282d"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <radialGradient id="cavity" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="0.65" stop-color="#1b1e23"/>
      <stop offset="1" stop-color="#31353c"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#474c54"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94602d"/>
      <stop offset="1" stop-color="#4a2b11"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- Sombra sobre la mesa -->
  <ellipse cx="124" cy="160" rx="106" ry="9" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <!-- Mango (detrás del cuerpo) -->
  <g transform="translate(222 62) rotate(-28)">
    <rect x="-8" y="-5.5" width="38" height="11" rx="4.5" fill="url(#neck)" stroke="#23262b" stroke-width="1"/>
    <rect x="26" y="-9" width="52" height="18" rx="9" fill="url(#grip)" stroke="#2b1708" stroke-width="1.3"/>
    <rect x="32" y="-6.5" width="38" height="3" rx="1.5" fill="#fff" opacity="0.18"/>
    <circle cx="70" cy="0.5" r="2.5" fill="#1b1006"/>
    <circle cx="30" cy="0" r="2" fill="#c9ced4" stroke="#40454c" stroke-width="0.6"/>
  </g>

  <!-- Asa pequeña izquierda -->
  <path d="M14,64 C4,62 0,70 4,76 C7,80 12,80 15,77" fill="none" stroke="#6d737c" stroke-width="5" stroke-linecap="round"/>

  <!-- Cuerpo del wok -->
  <path d="M12,68 C12,122 58,154 120,154 C182,154 228,122 228,68 Z" fill="url(#steel)" stroke="#0a0b0d" stroke-width="2.2"/>
  <path d="M28,94 C42,124 76,141 114,144" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M200,98 C190,122 166,138 140,144" fill="none" stroke="#000000" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>

  <!-- Aro y cavidad -->
  <ellipse cx="120" cy="68" rx="108" ry="46" fill="#30343a" stroke="#939aa4" stroke-width="3"/>
  <ellipse cx="120" cy="71" rx="98" ry="38" fill="url(#cavity)" stroke="#08090b" stroke-width="2"/>
  <ellipse cx="94" cy="57" rx="46" ry="7" fill="#ffffff" opacity="0.07" transform="rotate(-8 94 57)"/>
</svg>
