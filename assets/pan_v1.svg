<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 186" width="300" height="186">
  <defs>
    <linearGradient id="p1body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="0.5" stop-color="#262a30"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <radialGradient id="p1cavity" cx="0.45" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#30353d"/>
      <stop offset="0.5" stop-color="#181b20"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="p1steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4e9"/>
      <stop offset="0.5" stop-color="#97a0aa"/>
      <stop offset="1" stop-color="#555d67"/>
    </linearGradient>
    <linearGradient id="p1grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4f57"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <filter id="p1soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- Sombra sobre la cocina -->
  <ellipse cx="124" cy="156" rx="106" ry="8" fill="#000" opacity="0.5" filter="url(#p1soft)"/>

  <!-- Mango largo y recto (negro, con remaches y ojal) -->
  <g transform="translate(226 100) rotate(-7)">
    <rect x="-10" y="-5" width="36" height="10" rx="4" fill="url(#p1steel)" stroke="#1b1d21" stroke-width="1.1"/>
    <path d="M 0,-3 H 22" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="24" y="-7.5" width="50" height="15" rx="7.5" fill="url(#p1grip)" stroke="#050607" stroke-width="1.3"/>
    <rect x="30" y="-5" width="36" height="2.4" rx="1.2" fill="#ffffff" opacity="0.2"/>
    <circle cx="68" cy="0.5" r="2.6" fill="#050607" stroke="#6c737c" stroke-width="0.8"/>
    <circle cx="28" cy="0" r="2" fill="#c9ced4" stroke="#40454c" stroke-width="0.7"/>
  </g>

  <!-- Cuerpo bajo de la sartén -->
  <path d="M12,98 C12,126 52,142 120,142 C188,142 228,126 228,98 Z" fill="url(#p1body)" stroke="#16181b" stroke-width="2.2"/>
  <path d="M28,112 C44,128 78,137 114,138" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>
  <path d="M204,112 C194,128 170,137 144,139" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <!-- Aro y superficie antiadherente -->
  <ellipse cx="120" cy="98" rx="108" ry="40" fill="#23272d" stroke="#aab1ba" stroke-width="3"/>
  <path d="M 24,84 C 44,64 96,56 140,58" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="100" rx="98" ry="33" fill="url(#p1cavity)" stroke="#05060a" stroke-width="2"/>
  <ellipse cx="120" cy="101" rx="78" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <!-- Reflejos -->
  <path d="M 38,92 C 54,76 94,70 134,72" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <path d="M 46,99 C 54,91 66,86 80,84" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="118" cy="112" rx="40" ry="6" fill="#ffffff" opacity="0.05"/>
  <!-- Remaches -->
  <circle cx="219" cy="92" r="2.2" fill="#aab1ba" stroke="#2a2d31" stroke-width="0.7"/>
  <circle cx="221" cy="104" r="2.2" fill="#aab1ba" stroke="#2a2d31" stroke-width="0.7"/>
</svg>
