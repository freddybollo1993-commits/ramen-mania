<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 186" width="300" height="186">
  <defs>
    <linearGradient id="w3body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d424b"/>
      <stop offset="0.4" stop-color="#1f2227"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="w3cavity" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="0.45" stop-color="#14171b"/>
      <stop offset="1" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="w3steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5dbe1"/>
      <stop offset="0.5" stop-color="#8f98a2"/>
      <stop offset="1" stop-color="#4d555e"/>
    </linearGradient>
    <linearGradient id="w3wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b57a3f"/>
      <stop offset="0.55" stop-color="#8a5326"/>
      <stop offset="1" stop-color="#4f2e12"/>
    </linearGradient>
    <filter id="w3soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <!-- Sombra sobre la cocina -->
  <ellipse cx="124" cy="160" rx="106" ry="9" fill="#000" opacity="0.5" filter="url(#w3soft)"/>

  <!-- Mango largo de madera (a la derecha, ligeramente hacia arriba) -->
  <g transform="translate(222 70) rotate(-12)">
    <rect x="-8" y="-5" width="40" height="10" rx="4" fill="url(#w3steel)" stroke="#1b1d21" stroke-width="1.1"/>
    <path d="M 2,-3 H 28" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="28" y="-8.5" width="52" height="17" rx="8.5" fill="url(#w3wood)" stroke="#2b1708" stroke-width="1.3"/>
    <path d="M 34,-4 H 74 M 36,1 H 72 M 33,5 H 70" stroke="#2b1708" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
    <rect x="34" y="-6" width="38" height="2.6" rx="1.3" fill="#ffffff" opacity="0.22"/>
    <circle cx="33" cy="0" r="2" fill="#c9ced4" stroke="#40454c" stroke-width="0.7"/>
    <circle cx="73" cy="0.5" r="2.4" fill="#1b1006"/>
  </g>

  <!-- Pico vertedor a la izquierda -->
  <path d="M 20,58 L 7,52 Q 0,58 2,66 Q 4,72 10,74 L 22,72 Z" fill="url(#w3body)" stroke="#16181b" stroke-width="1.6" stroke-linejoin="round"/>
  <ellipse cx="5" cy="62" rx="3.4" ry="8.5" transform="rotate(-14 5 62)" fill="#050607" stroke="#98a0a9" stroke-width="1.3"/>
  <path d="M 9,55 Q 14,56 19,59" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Cuerpo del wok (negro brillante) -->
  <path d="M12,68 C12,122 58,154 120,154 C182,154 228,122 228,68 Z" fill="url(#w3body)" stroke="#16181b" stroke-width="2.2"/>
  <path d="M26,92 C40,124 76,142 114,146" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M34,84 C42,100 52,108 62,114" fill="none" stroke="#9fc4ff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <path d="M202,98 C192,122 168,138 142,145" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>

  <!-- Aro metálico y cavidad -->
  <ellipse cx="120" cy="68" rx="108" ry="46" fill="#23272d" stroke="#aab1ba" stroke-width="3"/>
  <path d="M 24,52 C 42,28 96,18 140,21" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="120" cy="71" rx="98" ry="38" fill="url(#w3cavity)" stroke="#05060a" stroke-width="2"/>
  <!-- Reflejos del interior -->
  <path d="M 36,62 C 52,44 92,36 136,38" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>
  <path d="M 44,70 C 52,60 66,54 82,51" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="116" cy="86" rx="42" ry="8" fill="#ffffff" opacity="0.05"/>
  <ellipse cx="170" cy="58" rx="22" ry="4" fill="#9fc4ff" opacity="0.1" transform="rotate(8 170 58)"/>
  <!-- Remaches del mango -->
  <circle cx="219" cy="61" r="2.2" fill="#aab1ba" stroke="#2a2d31" stroke-width="0.7"/>
  <circle cx="221" cy="73" r="2.2" fill="#aab1ba" stroke="#2a2d31" stroke-width="0.7"/>
</svg>
