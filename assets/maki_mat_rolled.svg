<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 110" width="50" height="110">
  <defs>
    <linearGradient id="rollShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a98a3c"/>
      <stop offset="0.4" stop-color="#ecd993"/>
      <stop offset="0.75" stop-color="#d1b55e"/>
      <stop offset="1" stop-color="#9a7d33"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-10%" width="170%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Esterilla de bambú completamente enrollada (cilindro vertical) -->
  <g filter="url(#shadow)">
    <rect x="5" y="8" width="40" height="94" rx="19" fill="url(#rollShade)" stroke="#86692a" stroke-width="1.8"/>
    <!-- varillas a lo largo del rollo -->
    <g stroke="#8d7330" stroke-width="1" opacity="0.7">
      <line x1="14" y1="14" x2="14" y2="96"/>
      <line x1="21" y1="11" x2="21" y2="99"/>
      <line x1="28" y1="11" x2="28" y2="99"/>
      <line x1="36" y1="14" x2="36" y2="96"/>
    </g>
    <!-- cordones -->
    <rect x="5" y="34" width="40" height="5" fill="#6a5a2e"/>
    <rect x="5" y="72" width="40" height="5" fill="#6a5a2e"/>
    <circle cx="40" cy="36.5" r="2.4" fill="#4d3f1d"/>
    <circle cx="40" cy="74.5" r="2.4" fill="#4d3f1d"/>
    <!-- extremo con la espiral del enrollado -->
    <ellipse cx="25" cy="14" rx="19" ry="6.5" fill="#d9c47a" stroke="#86692a" stroke-width="1.4"/>
    <path d="M25,14 m-2,0 a2,1.2 0 1,1 4,0 a4,2.4 0 1,1 -8,0 a6.5,3.6 0 1,1 13,0 a9,4.8 0 1,1 -18,0" fill="none" stroke="#8d7330" stroke-width="1"/>
  </g>
</svg>
