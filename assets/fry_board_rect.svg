<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebc687"/>
      <stop offset="1" stop-color="#d09f5d"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Tabla de cocina rectangular, vista de frente -->
  <g filter="url(#shadow)">
    <rect x="6" y="6" width="248" height="148" rx="14" fill="url(#wood)" stroke="#97672f" stroke-width="3"/>
  </g>
  <rect x="14" y="14" width="232" height="132" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Ranura de jugos -->
  <rect x="22" y="22" width="216" height="116" rx="10" fill="none" stroke="#b5803f" stroke-opacity="0.42" stroke-width="2.2"/>

  <!-- Veta de la madera -->
  <g fill="none" stroke="#b98446" stroke-width="1.3" opacity="0.5">
    <path d="M26,46 C80,40 170,52 234,44"/>
    <path d="M26,76 C86,82 176,70 234,78"/>
    <path d="M26,106 C82,100 172,112 234,104"/>
    <path d="M26,128 C88,132 178,122 234,130"/>
  </g>

  <!-- Agujero para colgar -->
  <circle cx="130" cy="14" r="4" fill="#5f3d1a" stroke="#97672f" stroke-width="1.2"/>
</svg>
