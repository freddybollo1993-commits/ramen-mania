<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shioBroth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="60%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>
  <!-- Vapor caliente -->
  <path d="M24,14 Q21,7 25,2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M33,12 Q36,6 32,1" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M42,14 Q40,7 43,2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Tazón de Cerámica Tradicional -->
  <ellipse cx="32" cy="56" rx="14" ry="4" fill="#004d40"/>
  <path d="M6,27 Q4,48 20,56 L44,56 Q60,48 58,27 Z" fill="url(#bowlGrad)" stroke="#2b1810" stroke-width="2.8"/>
  
  <!-- Superficie del Caldo Dorado Shio -->
  <ellipse cx="32" cy="27" rx="26" ry="11" fill="url(#shioBroth)" stroke="#2b1810" stroke-width="2.5"/>
  
  <!-- Reflejos y Ondas doradas de grasa/aceite brillante -->
  <ellipse cx="32" cy="27" rx="20" ry="7" fill="#fff9c4" opacity="0.45"/>
  <circle cx="20" cy="26" r="3" fill="#ffe082" stroke="#ffa000" stroke-width="1.2"/>
  <circle cx="41" cy="29" r="2.5" fill="#ffe082" stroke="#ffa000" stroke-width="1.2"/>
  <circle cx="33" cy="24" r="2" fill="#ffe082" stroke="#ffa000" stroke-width="1"/>
  <circle cx="26" cy="30" r="1.5" fill="#ffe082"/>
  
  <!-- Brillo blanco curvo -->
  <path d="M12,25 Q32,32 50,26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Borde decorativo del tazón -->
  <ellipse cx="32" cy="27" rx="26" ry="11" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
</svg>