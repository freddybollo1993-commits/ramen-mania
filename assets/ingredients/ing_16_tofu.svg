<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tofuCrust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="57" rx="24" ry="4.5" fill="#21120e" opacity="0.35"/>

  <!-- Triángulo trasero -->
  <g transform="translate(12, -4)">
    <polygon points="12,14 42,28 14,48" fill="#ffe082" stroke="#2b1810" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="12,14 42,28 38,36 10,22" fill="#ffb74d"/>
  </g>

  <!-- Triángulo delantero con costra dorada crocante -->
