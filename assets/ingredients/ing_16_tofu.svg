    <polygon points="12,37 34,14 50,40" fill="#fffde7"/>
    <polygon points="8,38 54,42 50,49 6,45" fill="#e65100" stroke="#2b1810" stroke-width="2.2" stroke-linejoin="round"/>

    <ellipse cx="26" cy="24" rx="4" ry="2" fill="#ffd54f" opacity="0.8"/>
    <ellipse cx="38" cy="30" rx="5" ry="3" fill="#ffb74d" opacity="0.7"/>
    <line x1="16" y1="36" x2="32" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>