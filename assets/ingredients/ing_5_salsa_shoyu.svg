<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ceramicTokkuri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f5f5f5"/>
      <stop offset="70%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="shoyuDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d2b0f"/>
      <stop offset="60%" stop-color="#4a1506"/>
      <stop offset="100%" stop-color="#260b03"/>
    </linearGradient>
  </defs>
  <!-- Sombra en la mesa -->
  <ellipse cx="30" cy="59" rx="16" ry="4" fill="#21120e" opacity="0.35"/>
  
  <!-- Botella tradicional de salsa Shoyu (Tokkuri / Cruet) -->
  <path d="M22,12 L34,12 L35,22 Q46,26 46,42 Q46,57 28,57 Q10,57 10,42 Q10,26 21,22 Z" 
        fill="url(#ceramicTokkuri)" stroke="#2b1810" stroke-width="2.6"/>
  <!-- Pico vertedor hacia la derecha -->
  <path d="M34,12 L46,8 L44,14 L34,16 Z" fill="#eeeeee" stroke="#2b1810" stroke-width="2.2"/>
  <!-- Tapa roja -->
  <ellipse cx="28" cy="12" rx="7" ry="2.5" fill="#d32f2f" stroke="#2b1810" stroke-width="2"/>
  <circle cx="28" cy="8" r="2.5" fill="#b71c1c" stroke="#2b1810" stroke-width="1.8"/>

  <!-- Etiqueta con franja bermellón y kanji tradicional "醤" estilizado -->
  <rect x="17" y="32" width="22" height="15" rx="3" fill="#fff8e1" stroke="#2b1810" stroke-width="1.8"/>
  <rect x="19" y="34" width="18" height="3" fill="#d32f2f"/>
  <circle cx="28" cy="41" r="3.5" fill="#d32f2f"/>
  <path d="M28,39 L28,43 M26.5,41 L29.5,41" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Gota espesa de salsa Shoyu cayendo del pico -->
  <path d="M52,14 C52,14 47,24 47,28 C47,31 49.5,33 52,33 C54.5,33 57,31 57,28 C57,24 52,14 52,14 Z" 
        fill="url(#shoyuDrop)" stroke="#2b1810" stroke-width="1.8"/>
  <circle cx="50.5" cy="27" r="1.3" fill="#ffffff" opacity="0.8"/>
</svg>