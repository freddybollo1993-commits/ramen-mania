<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tonkotsuBroth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff8e1"/>
      <stop offset="85%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </linearGradient>
    <linearGradient id="clayBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="70%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#21120e"/>
    </linearGradient>
  </defs>
  <!-- Vapor abundante y espeso -->
  <path d="M22,13 Q19,6 23,1" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M32,10 Q36,4 32,0" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
  <path d="M42,13 Q39,6 43,1" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Cuenco rústico de barro oscuro con filo dorado -->
  <ellipse cx="32" cy="57" rx="15" ry="4" fill="#1a0c08"/>
  <path d="M5,27 Q3,49 19,57 L45,57 Q61,49 59,27 Z" fill="url(#clayBowl)" stroke="#1a0c08" stroke-width="2.8"/>

  <!-- Superficie cremosa y densa Tonkotsu -->
  <ellipse cx="32" cy="27" rx="26" ry="11" fill="url(#tonkotsuBroth)" stroke="#1a0c08" stroke-width="2.5"/>

  <!-- Burbujas de colágeno y aceite concentrado -->
  <circle cx="21" cy="27" r="3.5" fill="#ffe082" stroke="#ffb74d" stroke-width="1.2"/>
  <circle cx="36" cy="25" r="4.2" fill="#ffd54f" stroke="#ffb74d" stroke-width="1.2"/>
  <circle cx="45" cy="30" r="2.8" fill="#ffe082" stroke="#ffb74d" stroke-width="1"/>
  <circle cx="28" cy="31" r="2.2" fill="#ffe082"/>
  <circle cx="35" cy="24" r="1.3" fill="#ffffff"/>

  <!-- Remolino cremoso -->
  <path d="M14,27 Q24,33 34,26 T48,27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Filete dorado en el labio del cuenco -->
  <ellipse cx="32" cy="27" rx="26" ry="11" fill="none" stroke="#ffb300" stroke-width="1.5" opacity="0.85"/>
</svg>