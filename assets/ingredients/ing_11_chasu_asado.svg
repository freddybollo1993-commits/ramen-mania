<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="meatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="40%" stop-color="#e57373"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d4925"/>
      <stop offset="50%" stop-color="#5c2018"/>
      <stop offset="100%" stop-color="#2d0a06"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="57" rx="24" ry="5" fill="#21120e" opacity="0.35"/>

  <!-- Rodaja trasera de Chashu -->
  <g transform="translate(10, -6)">
    <ellipse cx="28" cy="30" rx="21" ry="17" fill="url(#crustGrad)" stroke="#2b1810" stroke-width="2.5"/>
    <ellipse cx="28" cy="30" rx="18" ry="14" fill="url(#meatGrad)"/>
    <ellipse cx="28" cy="30" rx="12" ry="9" fill="#fff8e1" opacity="0.85"/>
    <ellipse cx="28" cy="30" rx="7" ry="5" fill="#c62828"/>
  </g>

  <!-- Rodaja delantera principal jugosa y caramelizada -->
  <g transform="translate(-2, 4)">
    <ellipse cx="28" cy="30" rx="23" ry="18" fill="url(#crustGrad)" stroke="#2b1810" stroke-width="2.8"/>
    <ellipse cx="28" cy="30" rx="20" ry="15" fill="url(#meatGrad)"/>
    
    <!-- Espiral de grasa fundida -->
    <path d="M12,30 C12,20 38,16 42,26 C46,36 22,42 18,34 C16,28 32,24 34,29 C36,33 26,36 24,33" 
          fill="none" stroke="#fff8e1" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="28" cy="31" r="5" fill="#8d2b0f" stroke="#4e1607" stroke-width="1.2"/>

    <!-- Marcas de flameado al soplete -->
    <line x1="14" y1="24" x2="22" y2="22" stroke="#2d0a06" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="28" y1="18" x2="38" y2="19" stroke="#2d0a06" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="44" y2="33" stroke="#2d0a06" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Brillos jugosos -->
    <ellipse cx="22" cy="26" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="34" cy="32" rx="2" ry="1.2" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>