<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="noriGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2e20"/>
      <stop offset="50%" stop-color="#0f1c12"/>
      <stop offset="100%" stop-color="#060c07"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="58" rx="24" ry="4" fill="#21120e" opacity="0.35"/>

  <!-- Lámina trasera de Nori crujiente -->
  <g transform="translate(10, -5) rotate(12 28 32)">
    <rect x="12" y="10" width="30" height="42" rx="3" fill="#0d170f" stroke="#000000" stroke-width="2.5"/>
    <line x1="16" y1="12" x2="16" y2="50" stroke="#1b3320" stroke-width="1.5" stroke-dasharray="2,3"/>
  </g>

  <!-- Lámina delantera principal de Alga Nori -->
  <g transform="translate(-4, 0) rotate(-6 28 32)">
    <rect x="14" y="8" width="32" height="44" rx="3.5" fill="url(#noriGrad)" stroke="#000000" stroke-width="2.8"/>
    
    <line x1="20" y1="10" x2="20" y2="50" stroke="#25422b" stroke-width="1.8" stroke-dasharray="3,3"/>
    <line x1="28" y1="10" x2="28" y2="50" stroke="#25422b" stroke-width="1.8" stroke-dasharray="3,3"/>
    <line x1="36" y1="10" x2="36" y2="50" stroke="#25422b" stroke-width="1.8" stroke-dasharray="3,3"/>

    <polygon points="16,10 26,10 40,50 30,50" fill="#ffffff" opacity="0.12"/>
    <path d="M16,12 L22,12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>