  </defs>
  <!-- Contenedor cuadrado -->
  <g filter="url(#shadow)">
    <rect x="4" y="4" width="92" height="92" rx="12" fill="url(#rim)" stroke="#7d8791" stroke-width="2.5"/>
  </g>
  <rect x="11" y="11" width="78" height="78" rx="8" fill="#c9d0d7" stroke="#97a2ac" stroke-width="1.5"/>
  <rect x="14" y="14" width="72" height="72" rx="6" fill="url(#flour)"/>
