  <ellipse cx="42" cy="38" rx="14" ry="8" fill="#ffffff"/>
  <g fill="#d9d5c8" opacity="0.7"><circle cx="30" cy="62" r="1.2"/><circle cx="58" cy="66" r="1.1"/><circle cx="70" cy="50" r="1.2"/><circle cx="24" cy="46" r="1"/><circle cx="52" cy="74" r="1.2"/><circle cx="66" cy="30" r="1"/></g>
  <path d="M24,70 C38,62 56,62 76,72" fill="none" stroke="#e1ddd0" stroke-width="1.6" opacity="0.8"/>
