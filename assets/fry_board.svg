<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <defs>
    <linearGradient id="boardWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebc687"/>
      <stop offset="1" stop-color="#d2a15f"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-12%" width="118%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Tabla de cocina con mango (vista frontal, plana) -->
  <g filter="url(#shadow)">
    <path d="M28,16 H236 Q250,16 250,30 V54 H274 Q292,54 292,75 Q292,96 274,96 H250 V120 Q250,134 236,134 H28 Q14,134 14,120 V30 Q14,16 28,16 Z"
          fill="url(#boardWood)" stroke="#97672f" stroke-width="2.8"/>
  </g>
  <rect x="21" y="23" width="222" height="104" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6"/>

  <!-- Ranura de jugos -->
  <rect x="30" y="31" width="206" height="88" rx="12" fill="none" stroke="#b5803f" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Veta de la madera -->
  <g fill="none" stroke="#b98446" stroke-width="1.2" opacity="0.5">
    <path d="M26,44 C80,38 150,50 232,42"/>
    <path d="M26,72 C90,78 160,66 232,74"/>
    <path d="M26,100 C84,94 156,106 232,98"/>
    <path d="M26,118 C100,122 170,114 232,120"/>
  </g>

  <!-- Agujero para colgar -->
  <circle cx="272" cy="75" r="7.5" fill="#5f3d1a" stroke="#97672f" stroke-width="1.4"/>
  <circle cx="270.5" cy="73.5" r="2.4" fill="#ffffff" opacity="0.25"/>
</svg>
