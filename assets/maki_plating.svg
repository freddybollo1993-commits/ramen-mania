<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 116" width="320" height="116">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b04a"/>
      <stop offset="1" stop-color="#3f8530"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Hoja verde donde se sirve el maki -->
  <g filter="url(#shadow)">
    <path d="M26,64 C66,26 150,30 204,42 C246,50 292,58 304,64 C292,72 246,82 204,88 C150,98 66,100 26,64 Z" fill="url(#leaf)" stroke="#2c6320" stroke-width="1.8"/>
    <path d="M26,64 L304,64" stroke="#2c6320" stroke-width="2" fill="none"/>
    <g stroke="#2c6320" stroke-width="1.1" opacity="0.55" fill="none">
      <path d="M70,64 L96,42"/><path d="M110,64 L136,38"/><path d="M150,64 L176,38"/><path d="M190,64 L214,42"/>
      <path d="M70,64 L96,86"/><path d="M110,64 L136,90"/><path d="M150,64 L176,90"/><path d="M190,64 L214,86"/>
    </g>
  </g>

  <!-- Platito de salsa de soya -->
  <g filter="url(#shadow)">
    <ellipse cx="42" cy="26" rx="24" ry="13" fill="#f5f2ea" stroke="#cfc8b5" stroke-width="1.4"/>
    <ellipse cx="42" cy="26" rx="18.5" ry="9.2" fill="#2a1409"/>
    <ellipse cx="36" cy="23.5" rx="7" ry="2.4" fill="#fff" opacity="0.28"/>
  </g>

  <!-- Wasabi y jengibre -->
  <g filter="url(#shadow)">
    <ellipse cx="292" cy="30" rx="11" ry="7.5" fill="#8cc34c" stroke="#5e8d2d" stroke-width="1.2"/>
    <ellipse cx="289" cy="27.5" rx="4" ry="2.2" fill="#c9e79a" opacity="0.7"/>
    <g fill="#f4a9b6" stroke="#d6788d" stroke-width="1">
      <ellipse cx="262" cy="22" rx="11" ry="5.5" transform="rotate(-12 262 22)"/>
      <ellipse cx="270" cy="30" rx="11" ry="5.5" transform="rotate(8 270 30)"/>
      <ellipse cx="260" cy="32" rx="10" ry="5" transform="rotate(-4 260 32)"/>
    </g>
  </g>

  <!-- Palillos -->
  <g stroke-linecap="round" fill="none">
    <path d="M120,104 L262,98" stroke="#d9a45a" stroke-width="3"/>
    <path d="M122,110 L264,104" stroke="#c98f47" stroke-width="3"/>
    <path d="M232,99.2 L262,98" stroke="#3b5ea8" stroke-width="3"/>
    <path d="M234,105.2 L264,104" stroke="#3b5ea8" stroke-width="3"/>
  </g>
</svg>
