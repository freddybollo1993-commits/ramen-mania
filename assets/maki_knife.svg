<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 120" width="40" height="120">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa4ab"/>
      <stop offset="0.45" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#c3ccd2"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80501f"/>
      <stop offset="0.5" stop-color="#5a3414"/>
      <stop offset="1" stop-color="#3d220c"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-8%" width="190%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Cuchillo en vertical: hoja hacia arriba, mango abajo -->
  <g filter="url(#shadow)">
    <path d="M31,72 L31,15 Q30,8 25,5 Q11,26 8,54 L8,72 Z" fill="url(#blade)" stroke="#808b93" stroke-width="1.2"/>
    <path d="M16,26 L16,70" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" fill="none"/>
    <rect x="7" y="70" width="25" height="7" rx="2" fill="#2a2a2a"/>
    <rect x="10" y="76" width="19" height="42" rx="8" fill="url(#handle)" stroke="#2f1a08" stroke-width="1.4"/>
    <circle cx="19.5" cy="92" r="2.6" fill="#e9c66b" stroke="#8a6a1e" stroke-width="0.8"/>
    <circle cx="19.5" cy="106" r="2.6" fill="#e9c66b" stroke="#8a6a1e" stroke-width="0.8"/>
  </g>
</svg>
